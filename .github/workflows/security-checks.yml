name: Engineering checks
on: [push, pull_request]
permissions: {contents: read}
jobs:
  browser-and-accounts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            firebase/tests/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install browser and isolated rule-test dependencies
        run: |
          npm ci
          npm ci --prefix firebase/tests
      - name: Verify model parity, browser validation and account adapters
        run: npm test
      - name: Build offline and Firebase studio variants
        run: |
          npm run build
          node scripts/build.mjs firebase/public-config.json firebase/public
      - name: Verify Firebase ownership, quotas and account lifecycle
        # A demo project and emulators require no cloud credentials. Run the
        # files sequentially because rule tests reset the emulator database.
        run: npx -y firebase-tools@latest emulators:exec --config firebase/emulator-config.json --only auth,firestore --project demo-auralis-rules "node --test --test-concurrency=1 firebase/tests/firestore.test.mjs firebase/firebase-account.test.mjs"
  security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-postgres-password
          POSTGRES_DB: auralis
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/pyproject.toml}
      - name: Install backend and validation tools
        run: python -m pip install -e './backend[test]' 'cfn-lint>=1.30,<2'
      - name: Apply schema as migration administrator
        env:
          PGPASSWORD: ci-only-postgres-password
        run: |
          psql -h localhost -U postgres -d auralis -v ON_ERROR_STOP=1 -f infra/postgres/schema.sql
          psql -h localhost -U postgres -d auralis -v ON_ERROR_STOP=1 -c "ALTER ROLE app_runtime PASSWORD 'ci-only-runtime-password'"
      - name: Verify database-enforced isolation as runtime role
        env:
          RLS_TEST_DATABASE_URL: postgresql://app_runtime:ci-only-runtime-password@localhost:5432/auralis
        run: python infra/tests/rls_probe.py
      - name: Backend security tests
        env:
          TEST_DATABASE_URL: postgresql://app_runtime:ci-only-runtime-password@localhost:5432/auralis
          TEST_REDIS_URL: redis://localhost:6379/0
        run: python -m pytest backend/tests -q
      - name: Validate infrastructure schema
        run: cfn-lint infra/aws/stack.yaml
