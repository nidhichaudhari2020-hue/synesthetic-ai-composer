[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "auralis-api"
version = "1.0.0"
description = "Tenant-isolated neural MIDI composer"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3",
  "psycopg[binary,pool]>=3.2,<4", "redis>=5,<7", "PyJWT[crypto]>=2.10,<3",
  "httpx>=0.28,<1", "prometheus-client>=0.21,<1", "music21>=9.3,<10", "numpy>=1.26,<3",
  "torch>=2.6,<3"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires PostgreSQL or Redis service", "ml: requires torch and music21"]
