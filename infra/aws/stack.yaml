AWSTemplateFormatVersion: '2010-09-09'
Description: Auralis private inference service, database, rate-limit store, HTTPS edge and monitoring. Starts at zero tasks until provisioned.
Parameters:
  CertificateArn:
    Type: String
    Description: ACM certificate in this AWS region for ApiHostname (validate domain ownership first).
    AllowedPattern: '^arn:aws[a-z-]*:acm:.*:certificate/.*$'
  ApiHostname:
    Type: String
    AllowedPattern: '^[a-zA-Z0-9.-]+$'
  FrontendOrigin:
    Type: String
    AllowedPattern: '^https://[a-zA-Z0-9.-]+$'
  OidcIssuer:
    Type: String
    AllowedPattern: '^https://[a-zA-Z0-9.-]+/$'
  OidcAudience:
    Type: String
  ApiImage:
    Type: String
    Description: Immutable ECR URI including @sha256 digest; image must include the approved trained checkpoint.
    AllowedPattern: '^.+@sha256:[a-f0-9]{64}$'
  MigrationImage:
    Type: String
    Description: Immutable ECR URI for infra/migration.Dockerfile.
    AllowedPattern: '^.+@sha256:[a-f0-9]{64}$'
  DesiredCount:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 4
    Description: Keep zero until the migration task, runtime secrets, OIDC and model checks succeed.
  EnablePaidBotControl:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
Conditions:
  PaidBotControl: !Equals [!Ref EnablePaidBotControl, 'true']
Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties: {CidrBlock: 10.42.0.0/16, EnableDnsHostnames: true, EnableDnsSupport: true}
  Gateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: {VpcId: !Ref Vpc, InternetGatewayId: !Ref Gateway}
  PublicA:
    Type: AWS::EC2::Subnet
    Properties: {VpcId: !Ref Vpc, CidrBlock: 10.42.0.0/24, AvailabilityZone: !Select [0, !GetAZs '']}
  PublicB:
    Type: AWS::EC2::Subnet
    Properties: {VpcId: !Ref Vpc, CidrBlock: 10.42.1.0/24, AvailabilityZone: !Select [1, !GetAZs '']}
  PrivateA:
    Type: AWS::EC2::Subnet
    Properties: {VpcId: !Ref Vpc, CidrBlock: 10.42.10.0/24, AvailabilityZone: !Select [0, !GetAZs '']}
  PrivateB:
    Type: AWS::EC2::Subnet
    Properties: {VpcId: !Ref Vpc, CidrBlock: 10.42.11.0/24, AvailabilityZone: !Select [1, !GetAZs '']}
  PublicRoutes:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref Vpc}
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties: {RouteTableId: !Ref PublicRoutes, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref Gateway}
  PublicAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicA, RouteTableId: !Ref PublicRoutes}
  PublicAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicB, RouteTableId: !Ref PublicRoutes}
  NatAddressA:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment
    Properties: {Domain: vpc}
  NatAddressB:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment
    Properties: {Domain: vpc}
  NatA:
    Type: AWS::EC2::NatGateway
    Properties: {AllocationId: !GetAtt NatAddressA.AllocationId, SubnetId: !Ref PublicA}
  NatB:
    Type: AWS::EC2::NatGateway
    Properties: {AllocationId: !GetAtt NatAddressB.AllocationId, SubnetId: !Ref PublicB}
  PrivateRoutesA:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref Vpc}
  PrivateRoutesB:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref Vpc}
  PrivateRouteA:
    Type: AWS::EC2::Route
    Properties: {RouteTableId: !Ref PrivateRoutesA, DestinationCidrBlock: 0.0.0.0/0, NatGatewayId: !Ref NatA}
  PrivateRouteB:
    Type: AWS::EC2::Route
    Properties: {RouteTableId: !Ref PrivateRoutesB, DestinationCidrBlock: 0.0.0.0/0, NatGatewayId: !Ref NatB}
  PrivateAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PrivateA, RouteTableId: !Ref PrivateRoutesA}
  PrivateAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PrivateB, RouteTableId: !Ref PrivateRoutesB}
  EdgeSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTPS entry only
      VpcId: !Ref Vpc
      SecurityGroupIngress: [{IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}]
      SecurityGroupEgress: [{IpProtocol: tcp, FromPort: 8000, ToPort: 8000, DestinationSecurityGroupId: !Ref TaskSecurityGroup}]
  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private API and bootstrap tasks
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp, FromPort: 5432, ToPort: 5432, DestinationSecurityGroupId: !Ref DatabaseSecurityGroup}
        - {IpProtocol: tcp, FromPort: 6379, ToPort: 6379, DestinationSecurityGroupId: !Ref CacheSecurityGroup}
  ApiIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: {GroupId: !Ref TaskSecurityGroup, IpProtocol: tcp, FromPort: 8000, ToPort: 8000, SourceSecurityGroupId: !Ref EdgeSecurityGroup}
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties: {GroupDescription: PostgreSQL private connections only, VpcId: !Ref Vpc, SecurityGroupEgress: [{IpProtocol: '-1', CidrIp: 127.0.0.1/32}]}
  DatabaseIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: {GroupId: !Ref DatabaseSecurityGroup, IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref TaskSecurityGroup}
  CacheSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties: {GroupDescription: Redis TLS private connections only, VpcId: !Ref Vpc, SecurityGroupEgress: [{IpProtocol: '-1', CidrIp: 127.0.0.1/32}]}
  CacheIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: {GroupId: !Ref CacheSecurityGroup, IpProtocol: tcp, FromPort: 6379, ToPort: 6379, SourceSecurityGroupId: !Ref TaskSecurityGroup}
  DatabaseSubnets:
    Type: AWS::RDS::DBSubnetGroup
    Properties: {DBSubnetGroupDescription: Auralis private database subnets, SubnetIds: [!Ref PrivateA, !Ref PrivateB]}
  DatabaseParameters:
    Type: AWS::RDS::DBParameterGroup
    Properties: {Family: postgres17, Description: Require encrypted database connections, Parameters: {rds.force_ssl: '1', log_connections: '1', log_disconnections: '1'}}
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: '17.11'
      DBInstanceClass: db.t4g.small
      DBName: auralis
      AllocatedStorage: '20'
      MaxAllocatedStorage: 100
      StorageType: gp3
      StorageEncrypted: true
      MasterUsername: auralis_migrator
      ManageMasterUserPassword: true
      MultiAZ: true
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      DeletionProtection: true
      CopyTagsToSnapshot: true
      EnableCloudwatchLogsExports: [postgresql]
      DBSubnetGroupName: !Ref DatabaseSubnets
      DBParameterGroupName: !Ref DatabaseParameters
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
  AppDbPassword:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Runtime database role password; provisioned by the isolated migration task
      GenerateSecretString: {PasswordLength: 48, ExcludePunctuation: true}
  RedisPassword:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Redis AUTH password
      GenerateSecretString: {PasswordLength: 48, ExcludePunctuation: true}
  RuntimeSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Runtime-only API configuration; initialized by migration and operator
      SecretString: '{"NOT_CONFIGURED":true}'
  CacheSubnets:
    Type: AWS::ElastiCache::SubnetGroup
    Properties: {Description: Private cache subnets, SubnetIds: [!Ref PrivateA, !Ref PrivateB]}
  Cache:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupDescription: Shared atomic rate limiting
      Engine: redis
      EngineVersion: '7.1'
      CacheNodeType: cache.t4g.small
      NumCacheClusters: 2
      AutomaticFailoverEnabled: true
      MultiAZEnabled: true
      AtRestEncryptionEnabled: true
      TransitEncryptionEnabled: true
      TransitEncryptionMode: required
      AuthToken: !Sub '{{resolve:secretsmanager:${RedisPassword}:SecretString}}'
      CacheSubnetGroupName: !Ref CacheSubnets
      SecurityGroupIds: [!Ref CacheSecurityGroup]
      SnapshotRetentionLimit: 1
  Cluster:
    Type: AWS::ECS::Cluster
    Properties: {ClusterSettings: [{Name: containerInsights, Value: enabled}]}
  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties: {RetentionInDays: 30}
  MigrationLogs:
    Type: AWS::Logs::LogGroup
    Properties: {RetentionInDays: 7}
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: 'sts:AssumeRole'}]}
      ManagedPolicyArns: [!Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy']
      Policies:
        - PolicyName: ReadOnlyRuntimeSecret
          PolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Action: 'secretsmanager:GetSecretValue', Resource: !Ref RuntimeSecret}]}
  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: 'sts:AssumeRole'}]}
  MigrationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: 'sts:AssumeRole'}]}
      Policies:
        - PolicyName: ProvisionDatabaseAndRuntimeConfig
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: 'secretsmanager:GetSecretValue', Resource: [!GetAtt Database.MasterUserSecret.SecretArn, !Ref AppDbPassword, !Ref RedisPassword, !Ref RuntimeSecret]}
              - {Effect: Allow, Action: 'secretsmanager:PutSecretValue', Resource: !Ref RuntimeSecret}
  ApiTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Cpu: '2048'
      Memory: '4096'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt ApiRole.Arn
      RuntimePlatform: {CpuArchitecture: X86_64, OperatingSystemFamily: LINUX}
      ContainerDefinitions:
        - Name: api
          Image: !Ref ApiImage
          Essential: true
          User: '10001:10001'
          ReadonlyRootFilesystem: true
          LinuxParameters: {Capabilities: {Drop: [ALL]}}
          PortMappings: [{ContainerPort: 8000, Protocol: tcp}]
          MountPoints: [{SourceVolume: scratch, ContainerPath: /tmp, ReadOnly: false}]
          Environment:
            - {Name: ENVIRONMENT, Value: production}
            - {Name: OIDC_ISSUER, Value: !Ref OidcIssuer}
            - {Name: OIDC_AUDIENCE, Value: !Ref OidcAudience}
            - {Name: CORS_ORIGINS, Value: !Sub '["${FrontendOrigin}"]'}
            - {Name: ALLOWED_HOSTS, Value: !Sub '["${ApiHostname}"]'}
            - {Name: TRUSTED_PROXY_CIDRS, Value: '["10.42.0.0/24","10.42.1.0/24"]'}
            - {Name: TURNSTILE_HOSTNAME, Value: !Select [2, !Split ['/', !Ref FrontendOrigin]]}
            - {Name: CHECKPOINT_PATH, Value: /models/composer.pt}
            - {Name: GENERATION_CONCURRENCY, Value: '1'}
            - {Name: GENERATION_TIMEOUT_SECONDS, Value: '45'}
          Secrets:
            - {Name: DATABASE_URL, ValueFrom: !Sub '${RuntimeSecret}:DATABASE_URL::'}
            - {Name: REDIS_URL, ValueFrom: !Sub '${RuntimeSecret}:REDIS_URL::'}
            - {Name: RATE_LIMIT_SECRET, ValueFrom: !Sub '${RuntimeSecret}:RATE_LIMIT_SECRET::'}
            - {Name: METRICS_TOKEN, ValueFrom: !Sub '${RuntimeSecret}:METRICS_TOKEN::'}
            - {Name: TURNSTILE_SECRET, ValueFrom: !Sub '${RuntimeSecret}:TURNSTILE_SECRET::'}
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: !Ref ApiLogs, awslogs-region: !Ref 'AWS::Region', awslogs-stream-prefix: api}
      Volumes: [{Name: scratch}]
  MigrationTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt MigrationRole.Arn
      ContainerDefinitions:
        - Name: migration
          Image: !Ref MigrationImage
          Essential: true
          User: '10001:10001'
          ReadonlyRootFilesystem: true
          Environment:
            - {Name: AWS_REGION, Value: !Ref 'AWS::Region'}
            - {Name: ADMIN_SECRET_ARN, Value: !GetAtt Database.MasterUserSecret.SecretArn}
            - {Name: APP_PASSWORD_SECRET_ARN, Value: !Ref AppDbPassword}
            - {Name: REDIS_PASSWORD_SECRET_ARN, Value: !Ref RedisPassword}
            - {Name: RUNTIME_SECRET_ARN, Value: !Ref RuntimeSecret}
            - {Name: DATABASE_HOST, Value: !GetAtt Database.Endpoint.Address}
            - {Name: REDIS_HOST, Value: !GetAtt Cache.PrimaryEndPoint.Address}
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: !Ref MigrationLogs, awslogs-region: !Ref 'AWS::Region', awslogs-stream-prefix: migration}
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      Subnets: [!Ref PublicA, !Ref PublicB]
      SecurityGroups: [!Ref EdgeSecurityGroup]
      LoadBalancerAttributes:
        - {Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true'}
        - {Key: routing.http.xff_header_processing.mode, Value: append}
        - {Key: idle_timeout.timeout_seconds, Value: '60'}
  Targets:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      TargetType: ip
      Port: 8000
      Protocol: HTTP
      HealthCheckPath: /health/ready
      Matcher: {HttpCode: '200'}
      TargetGroupAttributes: [{Key: deregistration_delay.timeout_seconds, Value: '60'}]
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{CertificateArn: !Ref CertificateArn}]
      DefaultActions: [{Type: forward, TargetGroupArn: !Ref Targets}]
  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      Cluster: !Ref Cluster
      TaskDefinition: !Ref ApiTask
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      PlatformVersion: '1.4.0'
      HealthCheckGracePeriodSeconds: 120
      DeploymentConfiguration: {DeploymentCircuitBreaker: {Enable: true, Rollback: true}, MinimumHealthyPercent: 100, MaximumPercent: 200}
      NetworkConfiguration: {AwsvpcConfiguration: {AssignPublicIp: DISABLED, SecurityGroups: [!Ref TaskSecurityGroup], Subnets: [!Ref PrivateA, !Ref PrivateB]}}
      LoadBalancers: [{ContainerName: api, ContainerPort: 8000, TargetGroupArn: !Ref Targets}]
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Scope: REGIONAL
      DefaultAction: {Allow: {}}
      VisibilityConfig: {CloudWatchMetricsEnabled: true, SampledRequestsEnabled: false, MetricName: auralis-edge}
      Rules:
        - Name: known-bad-inputs
          Priority: 0
          OverrideAction: {None: {}}
          Statement: {ManagedRuleGroupStatement: {VendorName: AWS, Name: AWSManagedRulesKnownBadInputsRuleSet}}
          VisibilityConfig: {CloudWatchMetricsEnabled: true, SampledRequestsEnabled: false, MetricName: auralis-bad-inputs}
        - Name: common-threats
          Priority: 1
          OverrideAction: {None: {}}
          Statement: {ManagedRuleGroupStatement: {VendorName: AWS, Name: AWSManagedRulesCommonRuleSet}}
          VisibilityConfig: {CloudWatchMetricsEnabled: true, SampledRequestsEnabled: false, MetricName: auralis-common}
        - Name: per-ip-edge-rate
          Priority: 2
          Action: {Block: {}}
          Statement: {RateBasedStatement: {Limit: 100, EvaluationWindowSec: 60, AggregateKeyType: IP}}
          VisibilityConfig: {CloudWatchMetricsEnabled: true, SampledRequestsEnabled: false, MetricName: auralis-rate}
        - !If
          - PaidBotControl
          - Name: bot-control
            Priority: 3
            OverrideAction: {None: {}}
            Statement: {ManagedRuleGroupStatement: {VendorName: AWS, Name: AWSManagedRulesBotControlRuleSet, ManagedRuleGroupConfigs: [{AWSManagedRulesBotControlRuleSet: {InspectionLevel: COMMON}}]}}
            VisibilityConfig: {CloudWatchMetricsEnabled: true, SampledRequestsEnabled: false, MetricName: auralis-bots}
          - !Ref AWS::NoValue
  WebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties: {ResourceArn: !Ref LoadBalancer, WebACLArn: !GetAtt WebAcl.Arn}
  Alerts:
    Type: AWS::SNS::Topic
  ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: API 5xx errors; connect an on-call subscription to the Alerts topic.
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions: [{Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName}]
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Alerts]
  CpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/ECS
      MetricName: CPUUtilization
      Dimensions: [{Name: ClusterName, Value: !Ref Cluster}, {Name: ServiceName, Value: !GetAtt Service.Name}]
      Statistic: Average
      Period: 60
      EvaluationPeriods: 5
      Threshold: 85
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Alerts]
  AuthDenialMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ApiLogs
      FilterPattern: '{ $.status = 401 || $.status = 403 }'
      MetricTransformations: [{MetricNamespace: Auralis/Security, MetricName: AuthenticationDenials, MetricValue: '1', DefaultValue: 0}]
  AuthDenialAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: Auralis/Security
      MetricName: AuthenticationDenials
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 30
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Alerts]
Outputs:
  ApiUrl: {Value: !Sub 'https://${ApiHostname}'}
  AlbDnsName: {Value: !GetAtt LoadBalancer.DNSName}
  AlbHostedZoneId: {Value: !GetAtt LoadBalancer.CanonicalHostedZoneID}
  ClusterArn: {Value: !GetAtt Cluster.Arn}
  ApiServiceName: {Value: !GetAtt Service.Name}
  MigrationTaskArn: {Value: !Ref MigrationTask}
  PrivateSubnetIds: {Value: !Join [',', [!Ref PrivateA, !Ref PrivateB]]}
  TaskSecurityGroupId: {Value: !Ref TaskSecurityGroup}
  RuntimeSecretArn: {Value: !Ref RuntimeSecret}
  AlertTopicArn: {Value: !Ref Alerts}
  DatabaseAdminSecretArn: {Value: !GetAtt Database.MasterUserSecret.SecretArn}
